[project]
name = "pythonproject-4"
version = "0.1.0"
description = "AINEWS: AI-генератор постов для Telegram"
authors = [
    { name = "BigSnake", email = "Al160574@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.58.0",
    "telethon>=1.38.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
pythonproject-4 = "pythonproject_4:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
